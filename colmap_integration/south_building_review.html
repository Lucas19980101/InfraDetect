<!doctype html>
<!-- SPDX-License-Identifier: BSD-3-Clause -->
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>South Building · 缺陷候选审核</title>
  <style>
    :root { color-scheme: light; font-family: Inter, system-ui, sans-serif; background: #f4f5f7; color: #202734; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    header { padding: 13px 22px; background: #18212e; color: white; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    header h1 { font-size: 17px; margin: 0; }
    header small { color: #b8c4d3; }
    main { height: calc(100vh - 55px); display: grid; grid-template-columns: minmax(420px, 1fr) minmax(410px, 560px); gap: 0; }
    .left { display: flex; flex-direction: column; min-width: 0; border-right: 1px solid #ccd3dc; }
    .canvas-bar { padding: 8px 14px; display: flex; justify-content: space-between; align-items: center; font-size: 12px; background: white; }
    #cloud { display: block; width: 100%; flex: 1; min-height: 250px; background: radial-gradient(circle at center, #fff 0, #e7ebf1 90%); cursor: grab; touch-action: none; }
    #cloud:active { cursor: grabbing; }
    .legend { display: flex; gap: 15px; }
    .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; }
    .crack { background: #ec4242; } .spalling { background: #ee9a29; }
    .candidate-list { background: white; padding: 10px 14px; height: 195px; overflow: auto; display: flex; flex-wrap: wrap; align-content: flex-start; gap: 7px; }
    .candidate { border: 1px solid #c7cfda; background: #fff; border-radius: 7px; padding: 7px 9px; cursor: pointer; font-size: 12px; }
    .candidate.selected { border: 2px solid #175bd1; padding: 6px 8px; }
    .candidate.confirmed { background: #e0f4e7; } .candidate.rejected { background: #f5e4e4; } .candidate.uncertain { background: #fff1d8; }
    .right { overflow: auto; padding: 17px; }
    .summary { margin: 0 0 12px; color: #657081; font-size: 13px; }
    h2 { font-size: 19px; margin: 0 0 8px; }
    .details { font-size: 13px; color: #4b596c; margin-bottom: 14px; line-height: 1.6; }
    .review { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 18px; }
    .review button { border: 1px solid #b9c3d0; background: white; padding: 8px 12px; border-radius: 7px; cursor: pointer; }
    .review button.active { background: #1f5bc2; color: white; border-color: #1f5bc2; }
    .review button:disabled { opacity: .5; }
    #save-status { font-size: 12px; color: #566577; min-height: 18px; }
    .toggle { font-size: 13px; display: flex; gap: 8px; align-items: center; margin: 8px 0 12px; }
    .toggle select { border: 1px solid #b9c3d0; background: white; border-radius: 6px; padding: 6px 8px; }
    .photo-card { background: white; border: 1px solid #d8dee7; border-radius: 9px; padding: 9px; margin: 0 0 13px; }
    .photo-head { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; padding-bottom: 8px; }
    .photo { position: relative; line-height: 0; }
    .photo img { display: block; width: 100%; height: auto; }
    .marker { position: absolute; width: 18px; height: 18px; margin: -9px 0 0 -9px; border: 2px solid #ffff38; box-shadow: 0 0 0 2px #111, 0 0 8px #111; border-radius: 50%; pointer-events: none; }
    .marker::after { content: ''; display: block; width: 4px; height: 4px; background: #111; border-radius: 50%; margin: 5px; }
    .help { font-size: 12px; color: #647285; }
    @media (max-width: 900px) { main { height: auto; display: block; } .left { height: 65vh; border-right: 0; } .right { overflow: visible; } }
  </style>
</head>
<body>
  <header><h1>South Building · 3D 缺陷候选审核</h1><small>仅本机访问 · 原始数据只读</small></header>
  <main>
    <section class="left">
      <div class="canvas-bar"><span>拖动旋转 · 滚轮缩放 · 点击彩色候选点</span><span class="legend"><span><i class="dot crack"></i>crack</span><span><i class="dot spalling"></i>spalling</span></span></div>
      <canvas id="cloud" aria-label="可旋转的稀疏三维点云"></canvas>
      <div class="candidate-list" id="candidate-list"></div>
    </section>
    <section class="right">
      <p class="summary" id="summary">载入中…</p>
      <h2 id="point-title">选择一个候选点</h2>
      <div class="details" id="point-details"></div>
      <div class="review" id="review-buttons"></div>
      <div id="save-status"></div>
      <label class="toggle">照片显示方式
        <select id="photo-mode">
          <option value="original">纯原图（无圈、无红色上色）</option>
          <option value="location">原图 + 黄色定位圈</option>
          <option value="prediction">模型预测叠加 + 黄色定位圈</option>
        </select>
      </label>
      <div id="photos"></div>
      <p class="help">黄圈表示 COLMAP 在该照片中观测到的三维点；红/橙色预测不等于人工真值。确认或否定后，结果保存在本次运行目录的 reviews.json。</p>
    </section>
  </main>
  <script>
    const reviewToken = "__REVIEW_TOKEN__";
    const canvas = document.getElementById("cloud");
    const context = canvas.getContext("2d");
    const list = document.getElementById("candidate-list");
    const photos = document.getElementById("photos");
    const statuses = {confirmed: "真实缺陷", rejected: "误报", uncertain: "不确定", unreviewed: "未审核"};
    let data, selected, yaw = 0.7, pitch = -0.28, zoom = 1, dragging = false, moved = false, lastX = 0, lastY = 0, projected = [];
    let center = [0, 0, 0], extent = 1;

    function fitCloud() {
      const points = data.background;
      const min = [Infinity, Infinity, Infinity], max = [-Infinity, -Infinity, -Infinity];
      for (const p of points) for (let i = 0; i < 3; i++) { min[i] = Math.min(min[i], p[i]); max[i] = Math.max(max[i], p[i]); }
      center = min.map((value, i) => (value + max[i]) / 2);
      extent = Math.max(...max.map((value, i) => value - min[i])) || 1;
    }

    function draw() {
      const rect = canvas.getBoundingClientRect();
      const ratio = window.devicePixelRatio || 1;
      canvas.width = Math.max(1, Math.round(rect.width * ratio));
      canvas.height = Math.max(1, Math.round(rect.height * ratio));
      context.setTransform(ratio, 0, 0, ratio, 0, 0);
      context.clearRect(0, 0, rect.width, rect.height);
      if (!data) return;
      const scale = Math.min(rect.width, rect.height) * 0.75 * zoom / extent;
      const cy = Math.cos(yaw), sy = Math.sin(yaw), cp = Math.cos(pitch), sp = Math.sin(pitch);
      const project = p => {
        const x = p[0] - center[0], y = p[1] - center[1], z = p[2] - center[2];
        const rx = cy * x + sy * z, rz = -sy * x + cy * z;
        return [rect.width / 2 + rx * scale, rect.height / 2 - (cp * y - sp * rz) * scale];
      };
      for (const p of data.background) {
        const [x, y] = project(p);
        if (x < 0 || x > rect.width || y < 0 || y > rect.height) continue;
        context.fillStyle = `rgba(${p[3]},${p[4]},${p[5]},0.48)`;
        context.fillRect(x, y, 2, 2);
      }
      projected = [];
      for (const p of data.candidates) {
        const [x, y] = project(p.xyz);
        projected.push({id: p.id, x, y});
        context.beginPath();
        context.arc(x, y, p.id === selected?.id ? 8 : 5, 0, Math.PI * 2);
        context.fillStyle = p.class === "crack" ? "#e72e3e" : "#ef9c23";
        context.fill();
        context.lineWidth = p.id === selected?.id ? 3 : 1.5;
        context.strokeStyle = p.id === selected?.id ? "#fff000" : "#101924";
        context.stroke();
      }
    }

    function renderList() {
      list.replaceChildren();
      for (const point of data.candidates) {
        const button = document.createElement("button");
        button.type = "button";
        const status = data.reviews[String(point.id)]?.status || "unreviewed";
        button.className = `candidate ${status} ${point.id === selected?.id ? "selected" : ""}`;
        button.textContent = `${point.class === "crack" ? "🔴" : "🟠"} #${point.id} · ${point[point.class].toFixed(2)} · ${statuses[status]}`;
        button.addEventListener("click", () => selectPoint(point));
        list.append(button);
      }
    }

    function renderPhotos() {
      photos.replaceChildren();
      if (!selected) return;
      const mode = document.getElementById("photo-mode").value;
      const overlay = mode === "prediction";
      for (const observation of selected.observations) {
        const card = document.createElement("article");
        card.className = "photo-card";
        const heading = document.createElement("div");
        heading.className = "photo-head";
        const name = document.createElement("strong");
        name.textContent = observation.image;
        const scores = document.createElement("span");
        scores.textContent = `crack ${observation.crack.toFixed(3)} · spalling ${observation.spalling.toFixed(3)}`;
        heading.append(name, scores);
        const frame = document.createElement("div");
        frame.className = "photo";
        const image = document.createElement("img");
        image.loading = "lazy";
        image.alt = `观测照片 ${observation.image}`;
        image.src = `${overlay ? "/previews/" : "/images/"}${encodeURIComponent(observation.image)}${overlay ? ".png" : ""}`;
        frame.append(image);
        if (mode !== "original") {
          const marker = document.createElement("div");
          marker.className = "marker";
          marker.style.left = `${100 * observation.x / observation.width}%`;
          marker.style.top = `${100 * observation.y / observation.height}%`;
          frame.append(marker);
        }
        card.append(heading, frame);
        photos.append(card);
      }
    }

    function selectPoint(point) {
      selected = point;
      document.getElementById("point-title").textContent = `${point.class} · 三维点 #${point.id}`;
      document.getElementById("point-details").textContent = `坐标 (${point.xyz.map(value => value.toFixed(3)).join(", ")}) · ${point.views} 个有效视角 · crack 中位概率 ${point.crack.toFixed(3)} · spalling 中位概率 ${point.spalling.toFixed(3)}`;
      document.getElementById("save-status").textContent = "";
      const buttons = document.getElementById("review-buttons");
      buttons.replaceChildren();
      const current = data.reviews[String(point.id)]?.status || "unreviewed";
      for (const [status, label] of Object.entries(statuses)) {
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = label;
        button.className = status === current ? "active" : "";
        button.addEventListener("click", () => saveReview(point.id, status));
        buttons.append(button);
      }
      renderList(); renderPhotos(); draw();
    }

    async function saveReview(pointId, status) {
      const label = document.getElementById("save-status");
      label.textContent = "保存中…";
      try {
        const response = await fetch("/api/review", {method: "POST", headers: {"Content-Type": "application/json", "X-Review-Token": reviewToken}, body: JSON.stringify({point_id: pointId, status})});
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        if (status === "unreviewed") delete data.reviews[String(pointId)];
        else data.reviews[String(pointId)] = {status};
        label.textContent = "已保存";
        selectPoint(selected);
        label.textContent = "已保存";
      } catch (error) { label.textContent = `保存失败：${error.message}`; }
    }

    canvas.addEventListener("pointerdown", event => { dragging = true; moved = false; lastX = event.clientX; lastY = event.clientY; canvas.setPointerCapture(event.pointerId); });
    canvas.addEventListener("pointermove", event => {
      if (!dragging) return;
      const dx = event.clientX - lastX, dy = event.clientY - lastY;
      if (Math.abs(dx) + Math.abs(dy) > 1) moved = true;
      yaw += dx * .008;
      pitch = Math.max(-1.5, Math.min(1.5, pitch + dy * .008));
      lastX = event.clientX; lastY = event.clientY; draw();
    });
    canvas.addEventListener("pointerup", event => {
      dragging = false;
      if (moved) return;
      const rect = canvas.getBoundingClientRect(), x = event.clientX - rect.left, y = event.clientY - rect.top;
      let closest = null, distance = 14;
      for (const point of projected) { const d = Math.hypot(point.x - x, point.y - y); if (d < distance) { closest = point; distance = d; } }
      if (closest) selectPoint(data.candidates.find(point => point.id === closest.id));
    });
    canvas.addEventListener("wheel", event => { event.preventDefault(); zoom = Math.max(.2, Math.min(8, zoom * Math.exp(-event.deltaY * .001))); draw(); }, {passive: false});
    document.getElementById("photo-mode").addEventListener("change", renderPhotos);
    window.addEventListener("resize", draw);
    fetch("/api/data").then(response => response.json()).then(value => {
      data = value; fitCloud();
      document.getElementById("summary").textContent = `${data.summary.images} 张照片 · ${data.summary.points3D.toLocaleString()} 个稀疏点 · ${data.candidates.length} 个候选；灰色/原色点为稀疏抽样显示，审核仅针对彩色候选。`;
      if (data.candidates.length) selectPoint(data.candidates[0]); else draw();
    }).catch(error => { document.getElementById("summary").textContent = `载入失败：${error.message}`; });
  </script>
</body>
</html>
