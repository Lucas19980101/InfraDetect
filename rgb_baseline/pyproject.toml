[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "infradetect-rgb"
version = "0.1.0"
description = "Minimal DeepLabV3+ RGB semantic-segmentation baseline"
requires-python = ">=3.10"
dependencies = [
  "albumentations>=2,<3",
  "numpy>=1.24",
  "opencv-python-headless>=4.8",
  "PyYAML>=6",
  "segmentation-models-pytorch>=0.3.3,<0.4",
  "torch>=2.1",
  "tqdm>=4.66",
]

[project.scripts]
rgb-train = "rgb_baseline.train:main"
rgb-evaluate = "rgb_baseline.evaluate:main"
rgb-predict = "rgb_baseline.predict:main"
rgb-prepare = "rgb_baseline.prepare:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
