seed: 42
data:
  root: dataset
  tile_size: 1024
  num_workers: 4
  ignore_index: 255
  class_names: [background, crack, spalling]
model:
  architecture: deeplabv3plus
  encoder: resnet50
  encoder_weights: imagenet
  num_classes: 3
train:
  batch_size: 4
  epochs: 50
  learning_rate: 0.0001
  weight_decay: 0.0001
  mixed_precision: true
  ce_weight: 0.5
  dice_weight: 0.5
  class_weights: null
  output_dir: runs/rgb_baseline
  checkpoint_every: 5
  keep_periodic_checkpoints: 3
inference:
  stride: 768
  batch_size: 4
  save_logits: true
  save_features: false
evaluation:
  relaxed_crack_radius: 3
