<!doctype html>
<!-- SPDX-License-Identifier: BSD-3-Clause; adapted from colmap/scripts/south_building_review.html -->
<!--
  本页是本地复核界面模板，由 infradetect.tbbr_review.py 提供数据与静态资源。
  左栏用于查看/选择三维候选点，右栏展示对应的 RGB/IR 原图、可选 mask
  和人工复核表单。前端只展示证据并提交人工选择；不执行模型推理，也不改原始标注。
  "__REVIEW_TOKEN__" 由本地服务替换为会话令牌，不应手工写入真实密钥。
-->
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>InfraDetect · TBBR 三维对应审核</title>
  <style>
    /* 左侧点云与右侧照片由 --cloud-width 控制宽度；窄屏改为上下布局。
       黄色 .marker 是当前三维点的位置提示，不是模型预测或缺陷边界。 */
    /* 基础配色和双栏布局；点云与照片可以拖动中间分隔条调宽度。 */
    :root { color-scheme: light; font-family: Inter, "Noto Sans SC", system-ui, sans-serif; color: #202734; background: #f4f5f7; }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; }
    header { min-height: 56px; padding: 12px 22px; background: #18212e; color: #fff; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    h1 { font-size: 17px; margin: 0; line-height: 1.3; }
    header small { color: #b8c4d3; font-size: 12px; }
    main { height: calc(100vh - 56px); display: grid; grid-template-columns: minmax(320px, var(--cloud-width, 54%)) 9px minmax(320px, 1fr); }
    .left { display: flex; flex-direction: column; min-width: 0; border-right: 1px solid #ccd3dc; }
    #splitter { cursor: col-resize; background: #c7d1df; touch-action: none; }
    #splitter:hover, #splitter:focus-visible { background: #4184dd; }
    .canvas-bar { padding: 10px 14px; background: white; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px; font-size: 12px; color: #4b596c; }
    .legend { white-space: nowrap; }
    .legend .key { margin-left: 8px; }
    .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; background: #ef7828; }
    #cloud { width: 100%; flex: 1; min-height: 260px; display: block; background: radial-gradient(circle at center, #fff, #e7ebf1); touch-action: none; cursor: grab; }
    #cloud:active { cursor: grabbing; }
    /* 左下候选列表只是导航控件；选中颜色不代表人工确认状态。 */
    .list-head { padding: 8px 14px; background: white; border-top: 1px solid #d8dee7; display: flex; align-items: center; gap: 10px; }
    .list-head strong { font-size: 12px; white-space: nowrap; }
    #search { width: 100%; min-width: 0; border: 1px solid #b9c3d0; border-radius: 6px; padding: 7px 9px; font-size: 12px; font-family: inherit; line-height: 1.2; }
    #candidate-list { background: white; padding: 9px 14px; height: 145px; overflow: auto; display: flex; flex-wrap: wrap; align-content: flex-start; gap: 7px; }
    .candidate { border: 1px solid #c7cfda; background: #fff; border-radius: 7px; padding: 7px 9px; cursor: pointer; font-size: 12px; font-family: inherit; line-height: 1.2; color: #273241; }
    .candidate.selected { border: 2px solid #175bd1; padding: 6px 8px; }
    .candidate.confirmed { background: #e0f4e7; } .candidate.rejected { background: #f5e4e4; } .candidate.uncertain { background: #fff1d8; }
    .right { overflow: auto; padding: 17px; }
    .summary { margin: 0 0 12px; color: #657081; font-size: 13px; line-height: 1.5; }
    h2 { font-size: 19px; margin: 0 0 8px; }
    .details { font-size: 13px; color: #4b596c; margin-bottom: 12px; line-height: 1.6; }
    /* 右侧证据卡和复核表单的状态，保存动作由下面的 POST 代码明确触发。 */
    .review { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
    .review button { border: 1px solid #b9c3d0; background: white; padding: 8px 12px; border-radius: 7px; cursor: pointer; font-size: 12px; font-family: inherit; line-height: 1.2; }
    .review button.active { background: #1f5bc2; color: white; border-color: #1f5bc2; }
    .evidence { background: #fff; border: 1px solid #d8dee7; border-radius: 9px; padding: 11px 13px; font-size: 13px; line-height: 1.55; margin: 10px 0; }
    .evidence p { margin: 5px 0; }
    #group-members { display: flex; flex-wrap: wrap; gap: 5px; margin: 8px 0; }
    #group-members button { border: 1px solid #c7cfda; background: #fff; border-radius: 5px; padding: 5px 7px; cursor: pointer; }
    #group-members button.active { background: #d9e8ff; border-color: #175bd1; }
    .group-form { display: grid; gap: 8px; margin: 12px 0; padding: 12px; background: #fff; border: 1px solid #d8dee7; border-radius: 9px; }
    .group-form label { display: grid; gap: 4px; font-size: 12px; }
    .group-form textarea { width: 100%; min-height: 55px; border: 1px solid #b9c3d0; border-radius: 6px; padding: 7px; font-family: inherit; }
    .group-form button { width: fit-content; border: 0; background: #1f5bc2; color: white; border-radius: 6px; padding: 8px 12px; cursor: pointer; }
    #save-status { font-size: 12px; color: #566577; min-height: 18px; }
    .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; margin: 9px 0 12px; }
    .controls label { font-size: 13px; display: flex; align-items: center; gap: 7px; }
    select { border: 1px solid #b9c3d0; background: white; border-radius: 6px; padding: 6px 8px; font-size: 12px; font-family: inherit; line-height: 1.2; }
    /* 照片卡片可滚轮缩放；mask 是服务端临时叠加，黄圈是前端独立图层。 */
    .photo-card { background: white; border: 1px solid #d8dee7; border-radius: 9px; padding: 9px; margin-bottom: 13px; }
    .photo-head { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; padding-bottom: 8px; }
    .photo-head .positive { color: #b74614; font-weight: 650; } .photo-head .negative { color: #637285; }
    .photo-head button { border: 1px solid #b9c3d0; border-radius: 5px; background: #fff; cursor: pointer; }
    .photo { overflow: auto; max-height: min(68vh, 700px); line-height: 0; background: #19212e; }
    .photo-stage { position: relative; width: 100%; min-width: 100%; }
    .photo img { display: block; width: 100%; height: auto; max-width: none; }
    .marker { position: absolute; width: 18px; height: 18px; margin: -9px 0 0 -9px; border: 2px solid #ffff38; box-shadow: 0 0 0 2px #111, 0 0 8px #111; border-radius: 50%; pointer-events: none; }
    .marker::after { content: ""; display: block; width: 4px; height: 4px; background: #111; border-radius: 50%; margin: 5px; }
    /* 全屏窗口沿用同一原图 URL 与复核状态，不额外生成低分辨率副本。 */
    dialog#photo-viewer { width: 100vw; max-width: none; height: 100vh; max-height: none; margin: 0; padding: 0; border: 0; color: #fff; background: #101317; }
    dialog#photo-viewer::backdrop { background: #101317; }
    .viewer-bar { height: 58px; display: flex; align-items: center; gap: 9px; padding: 8px 14px; background: #1b2028; }
    .viewer-bar strong { margin-right: auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .viewer-bar button { border: 1px solid #697383; border-radius: 6px; padding: 6px 10px; color: #fff; background: #2b3440; cursor: pointer; }
    .viewer-frame { height: calc(100vh - 58px); overflow: auto; display: flex; align-items: safe center; justify-content: safe center; cursor: grab; }
    .viewer-frame:active { cursor: grabbing; }
    .viewer-stage { position: relative; flex: none; width: min(100%, 1200px); }
    .viewer-stage img { display: block; width: 100%; height: auto; }
    dialog#photo-viewer .marker[hidden], .photo .marker[hidden] { display: none; }
    #show-more { display: none; width: 100%; border: 1px solid #b9c3d0; border-radius: 7px; background: #fff; padding: 9px; margin-bottom: 12px; cursor: pointer; font-size: 13px; font-family: inherit; line-height: 1.2; }
    .help { font-size: 12px; line-height: 1.6; color: #647285; }
    button:focus-visible, select:focus-visible, input:focus-visible, canvas:focus-visible { outline: 2px solid #175bd1; outline-offset: 2px; }
    @media (max-width: 900px) { main { height: auto; display: block; } #splitter { display: none; } .left { height: 68vh; border-right: 0; } .right { overflow: visible; } header { align-items: flex-start; flex-direction: column; } }
  </style>
</head>
<body>
  <!-- 左栏：点云画布、候选点筛选与可拖动分隔条。 -->
  <header><h1>InfraDetect · TBBR 三维对应审核</h1><small>Flug1_100 训练航线 · 仅本机访问 · 原标注只读</small></header>
  <main>
    <section class="left" aria-label="三维点云">
      <div class="canvas-bar"><span>拖动旋转 · 滚轮缩放 · 点击橙色点</span><span class="legend"><i class="dot"></i>≥2 张标注照片支持</span></div>
      <canvas id="cloud" aria-label="可旋转的稀疏三维点云" tabindex="0"></canvas>
      <div class="list-head"><strong>候选点</strong><input id="search" type="search" placeholder="输入三维点编号筛选" aria-label="按点编号筛选"><small id="list-count"></small></div>
      <div id="candidate-list"></div>
    </section>
    <div id="splitter" role="separator" tabindex="0" aria-label="拖动调整点云和图片栏宽度" aria-orientation="vertical"></div>
    <!-- 右栏：所选点的证据、人工判断和同点跨照片对照。
         mask 与黄色定位圈分别开关，原图可在全屏窗口独立查看。 -->
    <section class="right">
      <p class="summary" id="summary">载入稀疏重建与标注中…</p>
      <h2 id="point-title">选择一个三维点</h2>
      <div class="details" id="point-details"></div>
      <div class="review" id="review-buttons"></div>
      <div id="group-evidence" class="evidence" hidden></div>
      <div id="group-members"></div>
      <form id="group-form" class="group-form" hidden>
        <strong>人工综合判断（按连续点组保存）</strong>
        <label>RGB 可见缺陷是否支持此处热候选<select id="rgb-support"><option value="uncertain">不确定</option><option value="supported">支持</option><option value="not_supported">不支持</option></select></label>
        <label>是否有热源/环境干扰证据<select id="interference-judgement"><option value="uncertain">不确定</option><option value="equipment_suspected">疑似设备/空调影响</option><option value="material_boundary_suspected">疑似材质/构件边界</option><option value="sunlight_or_reflection_suspected">疑似日照/反射</option><option value="other_suspected">其他干扰线索</option><option value="no_interference_evidence">目前无干扰证据</option></select></label>
        <label>备注<textarea id="group-notes" maxlength="1000" placeholder="记录具体画面依据；不要把未支持自动等同于干扰"></textarea></label>
        <button type="submit">保存本组判断</button>
      </form>
      <form id="geometry-group-form" class="group-form" hidden>
        <strong>几何候选组人工判断</strong>
        <label>这组点如何处理<select id="geometry-group-status">
          <option value="uncertain">不确定</option><option value="suspected">值得复核</option>
          <option value="structure">正常构件</option><option value="reconstruction_noise">重建噪声</option>
          <option value="unreviewed">撤销判断</option>
        </select></label>
        <label>判断依据<textarea id="geometry-group-notes" maxlength="1000" placeholder="写明照片、构件或重建线索；组内并非必然同一缺陷"></textarea></label>
        <button type="submit">保存本组判断</button>
      </form>
      <div id="save-status" role="status"></div>
      <div class="controls">
        <label>影像通道<select id="channel"><option value="rgb">RGB</option><option value="thermal">热图（第 4 通道）</option></select></label>
        <label><input id="show-marker" type="checkbox" checked>黄色定位圈</label>
        <label><input id="show-thermal-mask" type="checkbox" checked><span id="thermal-mask-label">热桥标注 mask</span></label>
        <label class="model-layer" hidden><input id="show-rgb-mask" type="checkbox">RGB 缺陷 mask</label>
        <label class="model-layer" hidden><input id="show-equipment-mask" type="checkbox">设备提示边线</label>
        <button id="zoom-out" type="button" aria-label="缩小照片">−</button><span id="zoom-level">100%</span><button id="zoom-in" type="button" aria-label="放大照片">＋</button><button id="zoom-reset" type="button">重置</button>
      </div>
      <div id="photos"></div>
      <button id="show-more" type="button">显示更多照片</button>
      <p class="help">黄色圈是当前三维点在照片中的位置；橙红色叠加是 TBBRv2 原始 thermal bridge 标注，不是模型预测，也不等同于 Hollow/Stains。复核状态只写入独立的 reviews.json，不改动数据集。</p>
    </section>
  </main>
  <!-- 全屏窗口沿用同一观察记录；缩放只影响显示，不改变原图像素或标注。 -->
  <dialog id="photo-viewer" aria-label="全屏查看照片">
    <div class="viewer-bar"><strong id="viewer-title"></strong><button id="viewer-prev" type="button" aria-label="上一张">←</button><button id="viewer-next" type="button" aria-label="下一张">→</button><button id="viewer-zoom-out" type="button" aria-label="缩小全屏图片">−</button><span id="viewer-zoom-level">100%</span><button id="viewer-zoom-in" type="button" aria-label="放大全屏图片">＋</button><button id="viewer-zoom-reset" type="button">适合窗口</button><button id="viewer-close" type="button" aria-label="关闭全屏">关闭 ×</button></div>
    <div id="viewer-frame" class="viewer-frame"><div id="viewer-stage" class="viewer-stage"><img id="viewer-image" alt=""><div id="viewer-marker" class="marker"></div></div></div>
  </dialog>
  <script>
    // 服务端填入仅供本机复核提交使用的令牌；展示/切换照片不需要写入。
    const reviewToken = "__REVIEW_TOKEN__";
    const canvas = document.getElementById("cloud");
    const context = canvas.getContext("2d");
    const list = document.getElementById("candidate-list");
    const photos = document.getElementById("photos");
    const main = document.querySelector("main");
    const splitter = document.getElementById("splitter");
    const statuses = {confirmed: "确认热桥", rejected: "否定", uncertain: "不确定", unreviewed: "未审核"};
    let data, selected, yaw = 0.7, pitch = -0.28, zoom = 1, dragging = false, moved = false, lastX = 0, lastY = 0;
    let projected = [], center = [0, 0, 0], extent = 1, photoLimit = 12, photoZoom = 1;
    let selectedGroupId = null, renderedGroupId = null;
    let viewerIndex = 0, viewerZoom = 1, viewerBaseWidth = 1, viewerDragging = false, viewerLastX = 0, viewerLastY = 0;
    const viewer = document.getElementById("photo-viewer"), viewerFrame = document.getElementById("viewer-frame"), viewerStage = document.getElementById("viewer-stage");
    // 后端用 evidence_mode 标明来源；前端据此选文字和控件，不能混用标签语义。
    const modelMode = () => data?.summary?.evidence_mode === "model_prediction";
    const bfddMode = () => data?.summary?.evidence_mode === "bfdd_dense_original_labels";
    const geometryMode = () => data?.summary?.evidence_mode === "geometry_plane_candidate";
    const groupMode = () => modelMode() || geometryMode();
    const reviewLabels = () => geometryMode() ?
      {suspected: "值得复核", structure: "正常构件", reconstruction_noise: "重建噪声", uncertain: "不确定", unreviewed: "未审核"} : bfddMode() ?
      {confirmed: "对应正确", rejected: "对应错误", uncertain: "不确定", unreviewed: "未审核"} : statuses;
    // t/r/e 只是向本地服务请求哪几种叠加层；不改变底图或模型输出文件。
    const maskLayers = () => [document.getElementById("show-thermal-mask").checked ? "t" : "",
                              modelMode() && document.getElementById("show-rgb-mask").checked ? "r" : "",
                              modelMode() && document.getElementById("show-equipment-mask").checked ? "e" : ""].join("");
    // 用 scene_id 请求对应原图；layers 只影响展示，不会保存成新真值。
    const photoUrl = obs => {
      const channel = document.getElementById("channel").value;
      return `/api/photo/${encodeURIComponent(obs.scene_id)}?channel=${channel}&layers=${geometryMode() ? "" : maskLayers()}`;
    };

    function fitCloud() {
      // 用背景点估计展示尺度，使不同 COLMAP 坐标范围都能落进画布。
      const min = [Infinity, Infinity, Infinity], max = [-Infinity, -Infinity, -Infinity];
      for (const p of data.background) for (let i = 0; i < 3; i++) { min[i] = Math.min(min[i], p[i]); max[i] = Math.max(max[i], p[i]); }
      center = min.map((value, i) => (value + max[i]) / 2);
      extent = Math.max(...max.map((value, i) => value - min[i])) || 1;
    }
    function draw() {
      // 这里只进行屏幕投影与着色；实际 2D→3D 对应由后端重建结果提供。
      const rect = canvas.getBoundingClientRect(), ratio = window.devicePixelRatio || 1;
      canvas.width = Math.max(1, Math.round(rect.width * ratio));
      canvas.height = Math.max(1, Math.round(rect.height * ratio));
      context.setTransform(ratio, 0, 0, ratio, 0, 0);
      context.clearRect(0, 0, rect.width, rect.height);
      if (!data) return;
      const scale = Math.min(rect.width, rect.height) * .75 * zoom / extent;
      const cy = Math.cos(yaw), sy = Math.sin(yaw), cp = Math.cos(pitch), sp = Math.sin(pitch);
      const project = p => {
        const x = p[0] - center[0], y = p[1] - center[1], z = p[2] - center[2];
        const rx = cy * x + sy * z, rz = -sy * x + cy * z;
        return [rect.width / 2 + rx * scale, rect.height / 2 - (cp * y - sp * rz) * scale];
      };
      for (const p of data.background) {
        const [x, y] = project(p);
        if (x < 0 || x > rect.width || y < 0 || y > rect.height) continue;
        context.fillStyle = `rgba(${p[3]},${p[4]},${p[5]},.46)`;
        context.fillRect(x, y, 2, 2);
      }
      projected = [];
      for (const p of data.candidates) {
        const [x, y] = project(p.xyz);
        projected.push({id: p.id, x, y});
        if (x < -10 || x > rect.width + 10 || y < -10 || y > rect.height + 10) continue;
        context.beginPath();
        const inGroup = groupMode() && selectedGroupId && p.group_id === selectedGroupId;
        context.arc(x, y, p.id === selected?.id ? 7 : inGroup ? 5 : 3.5, 0, Math.PI * 2);
        context.fillStyle = inGroup ? "#ffd34d" : p.display_color ?
          `rgb(${p.display_color.join(",")})` : "#ef7828"; context.fill();
        context.lineWidth = p.id === selected?.id ? 2.5 : .8;
        context.strokeStyle = p.id === selected?.id ? "#243a66" : "#50301f";
        context.stroke();
      }
    }
    function renderList() {
      // 筛选/选中候选只改浏览状态，不把前端列表当成缺陷判定结果。
      const query = document.getElementById("search").value.trim().toLowerCase();
      if (groupMode()) {
        const filtered = data.groups.filter(group => !query || group.id.includes(query) || group.point_ids.some(id => String(id).includes(query)));
        document.getElementById("list-count").textContent = `${filtered.length} 组 / ${data.candidates.length} 点`;
        list.replaceChildren();
        for (const group of filtered) {
          const button = document.createElement("button");
          button.type = "button";
          button.className = `candidate ${group.id === selectedGroupId ? "selected" : ""}`;
          button.textContent = geometryMode() ?
            `${group.id} · ${group.point_count} 点 · ${group.positive_scenes.length} 可见照片 · 峰值 ${group.max_score.toPrecision(3)}` :
            `${group.id} · ${group.point_count} 点 · ${group.positive_scenes.length} 视角`;
          button.addEventListener("click", () => selectPoint(data.candidates.find(point => point.id === group.point_ids[0])));
          list.append(button);
        }
        return;
      }
      const filtered = query ? data.candidates.filter(p => String(p.id).includes(query) ||
        (bfddMode() && p.class_name.toLowerCase().includes(query))) : data.candidates;
      document.getElementById("list-count").textContent = `显示 ${Math.min(filtered.length, 100)} / ${filtered.length}`;
      list.replaceChildren();
      for (const point of filtered.slice(0, 100)) {
        const button = document.createElement("button"), status = data.reviews[String(point.id)]?.status || "unreviewed";
        button.type = "button";
        button.className = `candidate ${status} ${point.id === selected?.id ? "selected" : ""}`;
        button.textContent = geometryMode() ?
          `#${point.id} · 偏离 ${point.geometry_score.toPrecision(3)} · ${reviewLabels()[status]}` :
          `#${point.id}${bfddMode() ? " · " + point.class_name : ""} · ${point.positive_views}/${point.observed_views} 视角 · ${reviewLabels()[status]}`;
        button.addEventListener("click", () => selectPoint(point));
        list.append(button);
      }
    }
    // 每条证据占一行，方便区分模型提示、原标注和人工判断。
    function addEvidence(text) {
      const line = document.createElement("p"); line.textContent = text;
      document.getElementById("group-evidence").append(line);
    }
    // 当前组的 RGB 支持和热干扰判断是两个独立字段，不能互相推断。
    function renderGroup() {
      const evidence = document.getElementById("group-evidence");
      const form = document.getElementById("group-form");
      const members = document.getElementById("group-members");
      evidence.replaceChildren(); members.replaceChildren();
      const geometryForm = document.getElementById("geometry-group-form");
      evidence.hidden = !groupMode() || !selectedGroupId;
      form.hidden = !modelMode() || !selectedGroupId;
      geometryForm.hidden = !geometryMode() || !selectedGroupId;
      if (!groupMode() || !selectedGroupId) return;
      const group = data.groups.find(item => item.id === selectedGroupId);
      if (geometryMode()) {

          legend.append(key);
        }
        document.querySelector(".list-head strong").textContent = "三维标注候选";
        document.getElementById("search").placeholder = "输入点编号或 Cracks/Stains 等类别";
        document.getElementById("thermal-mask-label").textContent = "BFDD 原标注 mask";
        document.querySelector("#channel option[value='thermal']").textContent = "配对 IR 图（不表示该标注由 IR 识别）";
        document.querySelector(".help").textContent = "点云背景是真实稠密重建；彩色候选点来自原始稀疏轨迹在至少两张 RGB 主导的 BFDD 标签中命中同一类。原标注叠到 IR 只作空间对照，不代表缺陷可由 IR 识别。黄色圈可独立隐藏，全部 mask 取消即原图。";
      }
      document.getElementById("summary").textContent = geometryMode() ?
        `${data.summary.dense_points.toLocaleString()} 个稠密点 · ${data.summary.candidate_points.toLocaleString()} 个几何候选，展示分数最高的 ${data.summary.displayed_candidates.toLocaleString()} 个，组成 ${data.summary.candidate_groups.toLocaleString()} 个邻近组 · ${data.summary.linked_images} 张深度核验照片。橙点不是已确认缺陷。` : bfddMode() ?
        `${data.summary.registered_images} 张照片 · ${data.summary.dense_points.toLocaleString()} 个稠密点 · ${data.summary.candidate_points.toLocaleString()} 个至少两视角同类标注候选。彩色点按 BFDD 类别着色；不是稠密点逐点真值。` :
        `${data.summary.registered_images} 张照片 · ${data.summary.sparse_points.toLocaleString()} 个稀疏点 · ${data.summary.candidate_points.toLocaleString()} 个多视角${modelMode() ? "模型候选，分为 " + data.summary.candidate_groups + " 个空间组" : "标注候选"}。灰色/原色点是点云抽样，橙点是多视角对应的三维点。`;
      if (data.candidates.length) selectPoint(data.candidates[0]); else draw();
    }).catch(error => { document.getElementById("summary").textContent = `载入失败：${error.message}`; });
  </script>
</body>
</html>
