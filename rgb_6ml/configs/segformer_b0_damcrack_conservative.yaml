defaults: segformer_b0_6ml.yaml

experiment_name: segformer_b0_damcrack_conservative

train:
  epochs: 10
  learning_rate: 0.000003
  output_dir: runs/segformer_b0_damcrack_conservative

multidataset:
  base_checkpoint: runs/segformer_b0_6ml/best.pt
  samples_per_epoch: 6000
  sources:
    - name: dacl10k
      type: dacl
      split: train
      weight: 0.75
    - name: damcrack
      type: manifest
      manifest: ../../colmap/benchmark/datasets/damcrack/manifest.csv
      splits: [train]
      weight: 0.25
