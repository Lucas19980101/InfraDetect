seed: 42

data:
  root: ../datasets/dacl10k/raw/dacl10k_v2_devphase
  mask_cache: ../datasets/dacl10k/cache/labels_6ml
  class_names: [crack, spalling, exposed_rebar, rust, efflorescence, wetspot]
  crop_size: 512
  num_workers: 4
  ignore_other_dacl10k_classes: true
  split_manifest: data/split_manifest.csv

train:
  batch_size: 4
  gradient_accumulation_steps: 2
  mixed_precision: true
  epochs: 50
  learning_rate: 0.00006
  weight_decay: 0.01
  output_dir: runs/placeholder
  loss:
    name: bce_dice
    bce_weight: 0.5
    dice_weight: 0.5
    pos_weight: null

evaluation:
  tune_per_class_thresholds: true
  relaxed_crack_radius: 3
