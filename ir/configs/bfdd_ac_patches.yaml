seed: 42
task: components
data:
  root: ..
  manifest: ../data/bfdd_ac_patches/manifest.csv
  include_sources: [bfdd_ac_full, bfdd_ac_positive_crop, bfdd_ac_negative_crop]
  image_size: [512, 768]
  num_workers: 4
  class_names: [background, air_conditioner]
  augmentation:
    rotation_degrees: 10
    rotation_probability: 0.5
model:
  architecture: segformer_b0
  pretrained_name: nvidia/mit-b0
  classes: 2
  pretrained: true
train:
  batch_size: 2
  epochs: 20
  learning_rate: 0.00001
  weight_decay: 0.01
  mixed_precision: true
  class_weights: [0.5, 1.0]
  output_dir: ../runs/bfdd_ac_patches
