seed: 42
task: ir
data:
  root: ../../collected_datasets/Dataset_1x
  manifest: ../data/bfdd_split.csv
  image_size: [512, 640]
  num_workers: 4
  class_names: [Background, Cracks, Peeling, "Hollow Areas", Stains, Erosion]
model:
  architecture: deeplabv3plus
  encoder: resnet50
  classes: 6
  pretrained: true
train:
  batch_size: 4
  epochs: 50
  learning_rate: 0.0001
  weight_decay: 0.0001
  mixed_precision: true
  output_dir: ../runs/ir_bfdd
