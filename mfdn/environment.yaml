name: MFDN
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu128
      - torch==2.7.1+cu128
      - torchvision==0.22.1+cu128
      - numpy==1.26.4
      - scipy
      - scikit-image
      - pillow
      - matplotlib
      - tqdm
      - pyyaml
      - kornia==0.7.3
      - opencv-contrib-python==4.10.0.84
      - onnx
      - onnxruntime==1.18.1
